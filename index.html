<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter Italic';src:url('./assets/Inter-Italic.ttf') format('truetype-variations');font-weight:100 900;font-style:italic}
body{margin:0;background:#000;font-family:'Space Grotesk',ui-rounded,'Avenir Next',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

.flavor-card{position:relative;overflow:hidden;border:1.5px solid #dce4ed;border-radius:16px;background:#fff;cursor:pointer;display:flex;flex-direction:column;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.flavor-card.selected{border:2px solid #0b203e;box-shadow:0 0 0 3px rgba(185,239,64,.58),0 8px 18px rgba(11,32,62,.14);transform:translateY(-2px)}
.flavor-photo{height:114px;margin:7px;border-radius:11px;overflow:hidden;display:flex;flex-shrink:0;align-items:center;justify-content:center}
.flavor-photo img{width:100%;height:100%;object-fit:contain}
.fl-mint{background:#a9e3f8}.fl-berry{background:#ffadc6}.fl-lime{background:#78d65b}.fl-citrus{background:#ffca66}
.flavor-name{display:block;padding:2px 10px 11px;font-size:13px;font-weight:700;line-height:1.1;text-align:center;color:#0b203e}
.flavor-badge{position:absolute;top:9px;right:9px;display:none;padding:4px 7px;border-radius:99px;background:#b9ef40;color:#0b203e;font-size:10px;font-weight:800;letter-spacing:.02em}
.flavor-card.selected .flavor-badge{display:block}

.stage-panel{position:relative}
.checkout-footer{position:absolute;right:0;bottom:0;left:0;z-index:2;padding:8px 16px 12px;border-top:1px solid #edf1f5;background:rgba(252,253,255,.97);box-shadow:0 -10px 24px rgba(11,32,62,.12);backdrop-filter:blur(10px)}
.checkout-button{width:100%;min-height:48px;border:0;border-radius:11px;background:#0b203e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 7px 14px rgba(11,32,62,.16);color:#fff;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer}
.checkout-button span{margin-left:8px;color:#b9ef40;font-size:18px;vertical-align:-1px}
.purchase-backdrop{position:fixed;inset:0;background:rgba(4,20,47,.56);backdrop-filter:blur(2px)}
.purchase-sheet{position:fixed;right:0;bottom:0;left:0;max-width:480px;height:min(72vh,620px);margin:0 auto;overflow:hidden;border-top:0;border-radius:28px 28px 0 0;background:#fff;box-shadow:0 -12px 38px rgba(4,20,47,.24);display:flex;flex-direction:column}
.sheet-eyebrow{display:block;margin-bottom:7px;color:#627086;font-size:11px;font-weight:800;letter-spacing:.08em}
.selected-flavor-chip{display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;margin:4px 0 15px;padding:7px 10px 7px 7px;border:1px solid #c7e58d;border-radius:14px;background:#f7fce9;color:#0b203e}
.selected-flavor-chip img{width:34px;height:34px;flex-shrink:0;border-radius:9px;object-fit:cover}
.selected-flavor-chip span{display:block;color:#627086;font-size:10px;font-weight:700;line-height:1.1}
.selected-flavor-chip b{display:block;font-size:13px;line-height:1.15}
.selected-flavor-chip strong{margin-left:8px;color:#396d24;font-size:16px}

</style>
</helmet>

<div style="width:100%;max-width:480px;margin:0 auto;position:relative;height:100vh;overflow:hidden;background:#000">

  <!-- Hero -->
  <div onClick="{{ openSheet }}" style="position:relative;width:100%;height:100%;cursor:pointer">
    <img src="./assets/banner-hero.png" alt="Promoção DOT" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none">
  </div>

  <!-- Lightbox -->
  <div id="img-lightbox" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(4,20,47,.88);align-items:center;justify-content:center;padding:24px;cursor:zoom-out">
    <img id="img-lightbox-img" src="" alt="" style="max-width:100%;max-height:88vh;border-radius:14px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)">
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" class="purchase-backdrop"></div>
    <div class="purchase-sheet">

      <!-- Handle -->
      <div onClick="{{ closeSheet }}" style="width:40px;height:4px;background:rgba(11,32,62,.22);border-radius:2px;margin:10px auto 0;cursor:pointer;flex-shrink:0"></div>

      <!-- Sliding panels -->
      <div style="display:grid;flex:1;overflow:hidden">

        <!-- Stage 1: 1º sabor -->
        <div class="stage-panel" style="{{ stage1PanelStyle }}">
          <div style="padding:12px 16px 0;flex-shrink:0">
            <span class="sheet-eyebrow">MONTE SEU COMBO</span>
            <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.12;letter-spacing:-.03em;color:#0b203e">Escolha seu 1º sabor</h2>
            <p style="margin:7px 0 0;color:#627086;font-size:14px">Comece pelo sabor que mais combina com você.</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0;flex:1;overflow-y:auto">
            <sc-for list="{{ flavorList1 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓ Selecionado</span>
              </div>
            </sc-for>
          </div>
          <div style="height:20px;flex-shrink:0"></div>
        </div>

        <!-- Stage 2: 2º sabor -->
        <div class="stage-panel" style="{{ stage2PanelStyle }}">
          <div style="padding:12px 16px 0;flex-shrink:0">
            <button onClick="{{ backToStage1 }}" style="border:0;padding:0;background:none;color:rgba(11,32,62,.4);font-size:26px;line-height:1;cursor:pointer">←</button>
            <div class="selected-flavor-chip"><img src="{{ pick1Img }}" alt="{{ pick1Label }}"><span>1º sabor<b>{{ pick1Label }}</b></span><strong>✓</strong></div>
            <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.12;letter-spacing:-.03em;color:#0b203e">Escolha seu 2º sabor</h2>
            <p style="margin:7px 0 0;color:#627086;font-size:14px">Complete seu combo com mais um sabor.</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 100px;flex:1;overflow-y:auto">
            <sc-for list="{{ flavorList2 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓ Selecionado</span>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{ hasTempPick2 }}" hint-placeholder-val="{{ true }}">
          <div class="checkout-footer">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#627086;font-size:13px">
              <span style="display:grid;width:20px;height:20px;place-items:center;border-radius:50%;background:#b9ef40;color:#0b203e;font-size:11px;font-weight:900;flex-shrink:0">✓</span>
              <span>Seu combo: <b style="color:#0b203e">{{ comboLabel }}</b></span>
            </div>
            <button onClick="{{ finalizarCompra }}" class="checkout-button">FINALIZAR MEU COMBO <span>→</span></button>
          </div>
          </sc-if>
        </div>

      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FLAVORS = [
  { name: 'Menta',              img: './assets/sabor-menta.jpg',            color: 'fl-mint'   },
  { name: 'Frutas Vermelhas',   img: './assets/sabor-frutas-vermelhas.jpg', color: 'fl-berry'  },
  { name: 'Melancia com Limão', img: './assets/sabor-melancia-novo.png',    color: 'fl-lime'   },
  { name: 'Citrus',             img: './assets/sabor-citrus.jpg',           color: 'fl-citrus' },
];

class Component extends DCLogic {
  state = {
    sheetOpen: false,
    pick1: null,
    tempPick2: null,
  };

  openSheet = () => {
    this._bodyScrollY = window.scrollY;
    document.body.style.cssText = `position:fixed;top:-${this._bodyScrollY}px;width:100%;overflow:hidden`;
    this.setState({ sheetOpen: true });
  };
  closeSheet = () => {
    document.body.style.cssText = '';
    window.scrollTo(0, this._bodyScrollY || 0);
    this.setState({ sheetOpen: false });
  };
  backToStage1 = () => this.setState({ pick1: null, tempPick2: null });
  finalizarCompra = () => {
    document.body.style.cssText = '';
    try { window.top.location.href = 'https://minhadot.com'; } catch(e) { window.location.href = 'https://minhadot.com'; }
  };

  renderVals() {
    const { sheetOpen, pick1, tempPick2 } = this.state;
    const stage = pick1 == null ? 1 : 2;
    const p = (n) => `grid-area:1/1;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;transform:translateX(${(n - stage) * 100}%);transition:transform .38s cubic-bezier(.25,.46,.45,.94)${stage !== n ? ';pointer-events:none' : ''}`;

    const flavorList1 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${pick1 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ pick1: f.name }),
    }));

    const flavorList2 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${tempPick2 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ tempPick2: f.name }),
    }));

    const comboLabel = pick1 && tempPick2 ? `${pick1} + ${tempPick2}` : (pick1 || '');
    const pick1Img = (FLAVORS.find(f => f.name === pick1) || {}).img || '';

    return {
      sheetOpen,
      openSheet: this.openSheet,
      closeSheet: this.closeSheet,
      backToStage1: this.backToStage1,
      finalizarCompra: this.finalizarCompra,
      pick1Label: pick1 || '',
      pick1Img,
      comboLabel,
      hasTempPick2: !!tempPick2,
      stage1PanelStyle: p(1),
      stage2PanelStyle: p(2),
      flavorList1,
      flavorList2,
    };
  }
}
</script>
</body>
</html>
