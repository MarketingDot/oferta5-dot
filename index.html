<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter Italic';src:url('./assets/Inter-Italic.ttf') format('truetype-variations');font-weight:100 900;font-style:italic}
body{margin:0;background:#f2f2f2;font-family:'Space Grotesk',sans-serif;-webkit-tap-highlight-color:transparent}
@keyframes prizePop{0%{opacity:0;transform:scale(.75)}100%{opacity:1;transform:scale(1)}}
</style>
</helmet>

<div style="width:100%;max-width:480px;margin:0 auto;background:#f2f2f2;min-height:100vh">

  <!-- Hero image -->
  <div style="position:relative;width:100%;aspect-ratio:1152/2048">
    <img src="./assets/banner-hero.png" alt="Promoção DOT" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none">
  </div>

  <!-- Seção 1: 1º sabor (pago) -->
  <div style="background:#fff;padding:24px 16px 20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div style="width:26px;height:26px;border-radius:50%;background:#04142f;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:#fceb2e;font:700 14px 'Space Grotesk',sans-serif">1</span></div>
      <div style="font:700 20px/1.2 'Space Grotesk',sans-serif;color:#04142f">ESCOLHA SEU 1º SABOR</div>
    </div>
    <div style="font:400 13px 'Space Grotesk',sans-serif;color:rgba(4,20,47,.55);margin-bottom:16px;padding-left:36px">Você paga por este pouch</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <sc-for list="{{ flavorList1 }}" as="fl" hint-placeholder-count="4">
        <sc-if value="{{ fl.selected }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ fl.onClick }}" style="position:relative;border-radius:14px;border:2.5px solid #fceb2e;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
            <div style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#fceb2e;border:2px solid #04142f;display:flex;align-items:center;justify-content:center"><div style="width:7px;height:5px;border-left:2px solid #04142f;border-bottom:2px solid #04142f;transform:rotate(-45deg) translate(0.5px,-0.5px)"></div></div>
            <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
            <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
          </div>
        </sc-if>
        <sc-if value="{{ fl.unselected }}" hint-placeholder-val="{{ true }}">
          <div onClick="{{ fl.onClick }}" style="border-radius:14px;border:1.5px solid rgba(4,20,47,.15);background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
            <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
            <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <!-- Divisor -->
  <div style="background:#04142f;padding:14px 16px;display:flex;align-items:center;gap:10px">
    <div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div>
    <div style="background:#fceb2e;color:#04142f;font:700 11px 'Space Grotesk',sans-serif;padding:4px 12px;border-radius:20px;letter-spacing:.5px;white-space:nowrap">+ GANHE GRÁTIS</div>
    <div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div>
  </div>

  <!-- Seção 2: 2º sabor (grátis) -->
  <div style="background:#fff;padding:24px 16px 20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div style="width:26px;height:26px;border-radius:50%;background:#1f9d55;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:#fff;font:700 14px 'Space Grotesk',sans-serif">2</span></div>
      <div style="font:700 20px/1.2 'Space Grotesk',sans-serif;color:#04142f">ESCOLHA SEU 2º SABOR</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;padding-left:36px">
      <span style="font:400 13px 'Space Grotesk',sans-serif;color:rgba(4,20,47,.55)">Este você ganha</span>
      <span style="background:#fceb2e;color:#04142f;font:700 11px 'Space Grotesk',sans-serif;padding:2px 8px;border-radius:4px">GRÁTIS</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <sc-for list="{{ flavorList2 }}" as="fl" hint-placeholder-count="4">
        <sc-if value="{{ fl.selected }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ fl.onClick }}" style="position:relative;border-radius:14px;border:2.5px solid #1f9d55;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
            <div style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#1f9d55;border:2px solid #fff;display:flex;align-items:center;justify-content:center"><div style="width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0.5px,-0.5px)"></div></div>
            <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
            <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
          </div>
        </sc-if>
        <sc-if value="{{ fl.unselected }}" hint-placeholder-val="{{ true }}">
          <div onClick="{{ fl.onClick }}" style="border-radius:14px;border:1.5px solid rgba(4,20,47,.15);background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
            <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
            <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <!-- Resumo + CTA (aparece quando os dois estão selecionados) -->
  <sc-if value="{{ hasBothPicks }}" hint-placeholder-val="{{ false }}">
    <div style="background:#04142f;padding:20px 16px;margin-top:2px">
      <div style="font:700 11px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.5);letter-spacing:.5px;margin-bottom:12px">SEU COMBO</div>
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <div style="flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:10px;text-align:center">
          <div style="font:400 10px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.5);margin-bottom:4px">1º SABOR</div>
          <div style="font:700 13px 'Space Grotesk',sans-serif;color:#fff">{{ pick1 }}</div>
        </div>
        <div style="flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:10px;text-align:center;position:relative">
          <div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#fceb2e;color:#04142f;font:700 9px 'Space Grotesk',sans-serif;padding:2px 7px;border-radius:10px">GRÁTIS</div>
          <div style="font:400 10px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.5);margin-bottom:4px;margin-top:4px">2º SABOR</div>
          <div style="font:700 13px 'Space Grotesk',sans-serif;color:#fff">{{ pick2 }}</div>
        </div>
      </div>
      <div onClick="{{ finalize }}" style="background:#fceb2e;color:#04142f;text-align:center;padding:18px;border-radius:10px;font:700 17px 'Space Grotesk',sans-serif;cursor:pointer">FINALIZAR COMPRA →</div>
      <div style="text-align:center;margin-top:10px;font:400 12px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.4)">Frete grátis incluso</div>
    </div>
  </sc-if>

  <div style="height:40px"></div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FLAVORS = [
  { name: 'Menta', img: './assets/sabor-menta.jpg' },
  { name: 'Frutas Vermelhas', img: './assets/sabor-frutas-vermelhas.jpg' },
  { name: 'Melancia com Limão', img: './assets/sabor-melancia-novo.png' },
  { name: 'Citrus', img: './assets/sabor-citrus.jpg' },
];

class Component extends DCLogic {
  state = {
    pick1: null,
    pick2: null,
  };

  finalize = () => {
    try { window.top.location.href = 'https://minhadot.com'; } catch(e) { window.location.href = 'https://minhadot.com'; }
  };

  renderVals() {
    const { pick1, pick2 } = this.state;

    const flavorList1 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      selected: pick1 === f.name,
      unselected: pick1 !== f.name,
      onClick: () => this.setState({ pick1: f.name }),
    }));

    const flavorList2 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      selected: pick2 === f.name,
      unselected: pick2 !== f.name,
      onClick: () => this.setState({ pick2: f.name }),
    }));

    return {
      flavorList1,
      flavorList2,
      pick1: pick1 || '',
      pick2: pick2 || '',
      hasBothPicks: !!(pick1 && pick2),
      finalize: this.finalize,
    };
  }
}
</script>
</body>
</html>
