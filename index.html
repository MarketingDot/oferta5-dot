<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter Italic';src:url('./assets/Inter-Italic.ttf') format('truetype-variations');font-weight:100 900;font-style:italic}
body{margin:0;background:#000;font-family:'Space Grotesk',ui-rounded,'Avenir Next',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

.purchase-backdrop{position:fixed;inset:0;background:rgba(4,17,38,.64);backdrop-filter:blur(4px)}
.purchase-sheet{position:fixed;right:0;bottom:0;left:0;max-width:430px;height:min(82vh,700px);margin:0 auto;overflow:hidden;border-radius:30px 30px 0 0;background:#f7f6f1;box-shadow:0 -18px 60px rgba(4,17,38,.32);display:flex;flex-direction:column}
.stage-panel{position:relative;padding-bottom:104px}
.catalog-topbar{height:56px;padding:8px 14px 0;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;flex-shrink:0}
.catalog-title{text-align:center;color:#0b203e;font-size:14px;font-weight:800;letter-spacing:-.01em}
.icon-button{width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(11,32,62,.07);color:#0b203e;font-family:inherit;font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.icon-button.close{font-size:24px;font-weight:400}
.catalog-intro{padding:9px 18px 11px}
.catalog-intro h2{margin:0;color:#0b203e;font-size:25px;font-weight:800;line-height:1.08;letter-spacing:-.04em}
.catalog-intro p{margin:7px 0 0;color:#6f7886;font-size:13px;line-height:1.35}
.flavor-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:4px 16px 22px;overflow-y:auto}
.flavor-card{position:relative;min-height:156px;overflow:hidden;border:2px solid transparent;border-radius:20px;background:#fff;box-shadow:0 5px 18px rgba(11,32,62,.055);cursor:pointer;display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.flavor-card:active{transform:scale(.98)}
.flavor-card.selected{border-color:#0b203e;box-shadow:0 0 0 3px #b9ef40,0 9px 22px rgba(11,32,62,.13);transform:translateY(-2px)}
.flavor-photo{height:112px;margin:8px 8px 0;border-radius:14px;overflow:hidden;display:flex;flex-shrink:0;align-items:center;justify-content:center}
.flavor-photo img{width:100%;height:100%;object-fit:contain}
.fl-mint{background:#d9f3fc}.fl-berry{background:#ffe0e9}.fl-lime{background:#dff5d6}.fl-citrus{background:#ffedc9}
.flavor-name{display:grid;min-height:35px;place-items:center;padding:4px 9px 8px;color:#0b203e;font-size:12px;font-weight:700;line-height:1.1;text-align:center}
.flavor-badge{position:absolute;top:13px;right:13px;width:25px;height:25px;border-radius:50%;background:#b9ef40;box-shadow:0 3px 10px rgba(11,32,62,.18);color:#0b203e;font-size:14px;font-weight:900;display:none;place-items:center}
.flavor-card.selected .flavor-badge{display:grid}
.combo-dock{position:absolute;right:12px;bottom:12px;left:12px;z-index:5;min-height:72px;padding:10px 11px 10px 13px;border-radius:22px;background:#0b203e;box-shadow:0 12px 30px rgba(4,17,38,.28);display:flex;align-items:center;gap:10px}
.dock-thumb{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:#fff;object-fit:cover}
.dock-copy{min-width:0;flex:1;color:#fff}
.dock-copy small{display:block;margin-bottom:2px;color:#aeb8c7;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dock-copy b{display:block;overflow:hidden;color:#fff;font-size:13px;font-weight:700;line-height:1.18;text-overflow:ellipsis;white-space:nowrap}
.combo-count{width:45px;height:45px;flex-shrink:0;border-radius:50%;background:#b9ef40;color:#0b203e;font-size:13px;font-weight:900;display:grid;place-items:center}
.combo-dock.ready .combo-count{display:none}
.checkout-button{min-height:47px;padding:0 15px;border:0;border-radius:15px;background:#b9ef40;color:#0b203e;font-family:inherit;font-size:11px;font-weight:900;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.checkout-button span{margin-left:5px;font-size:16px;vertical-align:-1px}
@media (max-height:700px){.purchase-sheet{height:86vh}.catalog-topbar{height:49px}.catalog-intro{padding-top:4px;padding-bottom:8px}.catalog-intro h2{font-size:22px}.flavor-card{min-height:139px}.flavor-photo{height:96px}}

</style>
</helmet>

<div style="width:100%;max-width:480px;margin:0 auto;position:relative;height:100vh;overflow:hidden;background:#000">

  <!-- Hero -->
  <div onClick="{{ openSheet }}" style="position:relative;width:100%;height:100%;cursor:pointer">
    <img src="./assets/banner-hero.png" alt="Promoção DOT" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none">
  </div>

  <!-- Lightbox -->
  <div id="img-lightbox" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(4,20,47,.88);align-items:center;justify-content:center;padding:24px;cursor:zoom-out">
    <img id="img-lightbox-img" src="" alt="" style="max-width:100%;max-height:88vh;border-radius:14px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)">
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" class="purchase-backdrop"></div>
    <div class="purchase-sheet">
      <!-- Sliding panels -->
      <div style="display:grid;flex:1;overflow:hidden;position:relative">

        <!-- Stage 1: 1º sabor -->
        <div class="stage-panel" style="{{ stage1PanelStyle }}">
          <div class="catalog-topbar">
            <span></span>
            <span class="catalog-title">Sabores DOT</span>
            <button onClick="{{ closeSheet }}" class="icon-button close" aria-label="Fechar">×</button>
          </div>
          <div class="catalog-intro">
            <h2>Monte seu combo</h2>
            <p>Escolha o primeiro sabor para começar.</p>
          </div>
          <div class="flavor-grid">
            <sc-for list="{{ flavorList1 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓</span>
              </div>
            </sc-for>
          </div>
        </div>

        <!-- Stage 2: 2º sabor -->
        <div class="stage-panel" style="{{ stage2PanelStyle }}">
          <div class="catalog-topbar">
            <button onClick="{{ backToStage1 }}" class="icon-button" aria-label="Voltar">←</button>
            <span class="catalog-title">Sabores DOT</span>
            <button onClick="{{ closeSheet }}" class="icon-button close" aria-label="Fechar">×</button>
          </div>
          <div class="catalog-intro">
            <h2>Complete seu combo</h2>
            <p>Agora escolha o segundo sabor.</p>
          </div>
          <div class="flavor-grid">
            <sc-for list="{{ flavorList2 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div class="{{ dockClass }}">
          <sc-if value="{{ hasPick1 }}" hint-placeholder-val="{{ true }}">
            <img class="dock-thumb" src="{{ pick1Img }}" alt="{{ pick1Label }}">
          </sc-if>
          <div class="dock-copy">
            <small>Seu combo</small>
            <b>{{ dockLabel }}</b>
          </div>
          <span class="combo-count">{{ selectedCount }}/2</span>
          <sc-if value="{{ hasTempPick2 }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ finalizarCompra }}" class="checkout-button">FINALIZAR <span>→</span></button>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FLAVORS = [
  { name: 'Menta',              img: './assets/sabor-menta.jpg',            color: 'fl-mint'   },
  { name: 'Frutas Vermelhas',   img: './assets/sabor-frutas-vermelhas.jpg', color: 'fl-berry'  },
  { name: 'Melancia com Limão', img: './assets/sabor-melancia-novo.png',    color: 'fl-lime'   },
  { name: 'Citrus',             img: './assets/sabor-citrus.jpg',           color: 'fl-citrus' },
];

class Component extends DCLogic {
  state = {
    sheetOpen: false,
    pick1: null,
    tempPick2: null,
  };

  openSheet = () => {
    this._bodyScrollY = window.scrollY;
    document.body.style.cssText = `position:fixed;top:-${this._bodyScrollY}px;width:100%;overflow:hidden`;
    this.setState({ sheetOpen: true });
  };
  closeSheet = () => {
    document.body.style.cssText = '';
    window.scrollTo(0, this._bodyScrollY || 0);
    this.setState({ sheetOpen: false });
  };
  backToStage1 = () => this.setState({ pick1: null, tempPick2: null });
  finalizarCompra = () => {
    document.body.style.cssText = '';
    try { window.top.location.href = 'https://minhadot.com'; } catch(e) { window.location.href = 'https://minhadot.com'; }
  };

  renderVals() {
    const { sheetOpen, pick1, tempPick2 } = this.state;
    const stage = pick1 == null ? 1 : 2;
    const p = (n) => `grid-area:1/1;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;transform:translateX(${(n - stage) * 100}%);transition:transform .38s cubic-bezier(.25,.46,.45,.94)${stage !== n ? ';pointer-events:none' : ''}`;

    const flavorList1 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${pick1 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ pick1: f.name }),
    }));

    const flavorList2 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${tempPick2 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ tempPick2: f.name }),
    }));

    const comboLabel = pick1 && tempPick2 ? `${pick1} + ${tempPick2}` : (pick1 || '');
    const pick1Img = (FLAVORS.find(f => f.name === pick1) || {}).img || '';
    const selectedCount = (pick1 ? 1 : 0) + (tempPick2 ? 1 : 0);
    const dockLabel = comboLabel || 'Escolha 2 sabores';

    return {
      sheetOpen,
      openSheet: this.openSheet,
      closeSheet: this.closeSheet,
      backToStage1: this.backToStage1,
      finalizarCompra: this.finalizarCompra,
      pick1Label: pick1 || '',
      pick1Img,
      comboLabel,
      dockLabel,
      dockClass: `combo-dock${tempPick2 ? ' ready' : ''}`,
      selectedCount,
      hasPick1: !!pick1,
      hasTempPick2: !!tempPick2,
      stage1PanelStyle: p(1),
      stage2PanelStyle: p(2),
      flavorList1,
      flavorList2,
    };
  }
}
</script>
</body>
</html>
