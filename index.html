<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter Italic';src:url('./assets/Inter-Italic.ttf') format('truetype-variations');font-weight:100 900;font-style:italic}
body{margin:0;background:#000;font-family:'Space Grotesk',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@keyframes prizePop{0%{opacity:0;transform:scale(.75) rotate(-6deg)}55%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
</style>
</helmet>

<div style="width:100%;max-width:480px;margin:0 auto;position:relative;height:100vh;overflow:hidden;background:#000">

  <!-- Hero image — clicável abre o sheet -->
  <div onClick="{{ openSheet }}" style="position:relative;width:100%;height:100%;cursor:pointer">
    <img src="./assets/banner-hero.png" alt="Promoção DOT" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none">
  </div>

  <!-- Sheet overlay -->
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:fixed;inset:0;background:rgba(4,20,47,.55);z-index:100"></div>
    <div style="position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:88vh;background:#fff;border-top:2px solid #04142f;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:10px 16px 24px;box-shadow:0 -8px 0 rgba(4,20,47,.08);overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;z-index:101">

      <!-- Handle -->
      <div onClick="{{ closeSheet }}" style="width:40px;height:4px;background:rgba(4,20,47,.2);border-radius:2px;margin:0 auto 14px;cursor:pointer;flex-shrink:0"></div>

      <!-- Título + back -->
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
        <sc-if value="{{ showBackBtn }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ backAction }}" style="flex:none;cursor:pointer;color:rgba(4,20,47,.4);font:500 24px 'Space Grotesk',sans-serif;line-height:1;padding:0 4px">←</div>
        </sc-if>
        <div style="{{ sheetTitleStyle }}">{{ sheetTitle }}</div>
      </div>

      <!-- Progress -->
      <div style="margin-top:10px;margin-bottom:16px;display:flex;gap:6px;flex-shrink:0">
        <div style="{{ sheetSeg1 }}"></div>
        <div style="{{ sheetSeg2 }}"></div>
      </div>

      <!-- Slider -->
      <div style="display:grid;overflow:hidden;margin:0 -16px;flex:1">

        <!-- Stage 1: 1º sabor -->
        <div style="{{ stage1Style }}">
          <div style="font:400 13px 'Space Grotesk',sans-serif;color:rgba(4,20,47,.5);padding:0 16px 10px">Você paga por este pouch</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px">
            <sc-for list="{{ flavorList1 }}" as="fl" hint-placeholder-count="4">
              <sc-if value="{{ fl.selected }}" hint-placeholder-val="{{ false }}">
                <div onClick="{{ fl.onClick }}" style="position:relative;border-radius:14px;border:2.5px solid #fceb2e;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
                  <div style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#fceb2e;border:2px solid #04142f;display:flex;align-items:center;justify-content:center"><div style="width:7px;height:5px;border-left:2px solid #04142f;border-bottom:2px solid #04142f;transform:rotate(-45deg) translate(0.5px,-0.5px)"></div></div>
                  <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
                  <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
                </div>
              </sc-if>
              <sc-if value="{{ fl.unselected }}" hint-placeholder-val="{{ true }}">
                <div onClick="{{ fl.onClick }}" style="border-radius:14px;border:1.5px solid rgba(4,20,47,.15);background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
                  <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
                  <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
                </div>
              </sc-if>
            </sc-for>
          </div>
          <sc-if value="{{ pick1 }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ goToStage2 }}" style="margin:16px 16px 0;background:#fceb2e;color:#04142f;text-align:center;padding:17px;border-radius:10px;font:700 16px 'Space Grotesk',sans-serif;cursor:pointer">PRÓXIMO → ESCOLHER SABOR GRÁTIS</div>
          </sc-if>
        </div>

        <!-- Stage 2: 2º sabor grátis -->
        <div style="{{ stage2Style }}">
          <div style="display:flex;align-items:center;gap:6px;padding:0 16px 10px">
            <span style="font:400 13px 'Space Grotesk',sans-serif;color:rgba(4,20,47,.5)">Este você ganha</span>
            <span style="background:#fceb2e;color:#04142f;font:700 11px 'Space Grotesk',sans-serif;padding:2px 8px;border-radius:4px">GRÁTIS</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px">
            <sc-for list="{{ flavorList2 }}" as="fl" hint-placeholder-count="4">
              <sc-if value="{{ fl.selected }}" hint-placeholder-val="{{ false }}">
                <div onClick="{{ fl.onClick }}" style="position:relative;border-radius:14px;border:2.5px solid #1f9d55;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
                  <div style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#1f9d55;border:2px solid #fff;display:flex;align-items:center;justify-content:center"><div style="width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0.5px,-0.5px)"></div></div>
                  <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
                  <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
                </div>
              </sc-if>
              <sc-if value="{{ fl.unselected }}" hint-placeholder-val="{{ true }}">
                <div onClick="{{ fl.onClick }}" style="border-radius:14px;border:1.5px solid rgba(4,20,47,.15);background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
                  <div style="width:100%;aspect-ratio:1;background:#f0f3fb;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{ fl.img }}" alt="{{ fl.name }}" style="width:100%;height:100%;object-fit:cover"></div>
                  <div style="font:700 13px 'Space Grotesk',sans-serif;color:#04142f;text-align:center;line-height:1.2">{{ fl.name }}</div>
                </div>
              </sc-if>
            </sc-for>
          </div>
          <sc-if value="{{ pick2 }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ finalize }}" style="margin:16px 16px 0;background:#fceb2e;color:#04142f;text-align:center;padding:17px;border-radius:10px;font:700 16px 'Space Grotesk',sans-serif;cursor:pointer">FINALIZAR COMPRA →</div>
          </sc-if>
        </div>

      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FLAVORS = [
  { name: 'Menta', img: './assets/sabor-menta.jpg' },
  { name: 'Frutas Vermelhas', img: './assets/sabor-frutas-vermelhas.jpg' },
  { name: 'Melancia com Limão', img: './assets/sabor-melancia-novo.png' },
  { name: 'Citrus', img: './assets/sabor-citrus.jpg' },
];

class Component extends DCLogic {
  state = {
    sheetOpen: false,
    stage: 1,
    pick1: null,
    pick2: null,
  };

  openSheet = () => {
    this._scrollY = window.scrollY;
    document.body.style.cssText = `position:fixed;top:-${this._scrollY}px;width:100%;overflow:hidden`;
    this.setState({ sheetOpen: true, stage: 1, pick1: null, pick2: null });
  };

  closeSheet = () => {
    document.body.style.cssText = '';
    window.scrollTo(0, this._scrollY || 0);
    this.setState({ sheetOpen: false });
  };

  goToStage2 = () => this.setState({ stage: 2 });

  backAction = () => this.setState({ stage: 1, pick2: null });

  finalize = () => {
    document.body.style.cssText = '';
    try { window.top.location.href = 'https://minhadot.com'; } catch(e) { window.location.href = 'https://minhadot.com'; }
  };

  renderVals() {
    const { sheetOpen, stage, pick1, pick2 } = this.state;
    const p = (n) => `grid-area:1/1;min-width:0;padding:0;display:flex;flex-direction:column;gap:0;transform:translateX(${(n-stage)*100}%);transition:transform .38s cubic-bezier(.25,.46,.45,.94)${stage!==n?';pointer-events:none':''}`;

    const flavorList1 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      selected: pick1 === f.name, unselected: pick1 !== f.name,
      onClick: () => this.setState({ pick1: f.name }),
    }));
    const flavorList2 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      selected: pick2 === f.name, unselected: pick2 !== f.name,
      onClick: () => this.setState({ pick2: f.name }),
    }));

    return {
      sheetOpen,
      openSheet: this.openSheet,
      closeSheet: this.closeSheet,
      goToStage2: this.goToStage2,
      backAction: this.backAction,
      finalize: this.finalize,
      pick1, pick2,
      flavorList1, flavorList2,
      showBackBtn: stage === 2,
      sheetTitle: stage === 1 ? 'Escolha seu 1º sabor' : 'Escolha seu 2º sabor grátis',
      sheetTitleStyle: `font:700 22px 'Space Grotesk',sans-serif;color:#04142f;line-height:1.2;flex:1${stage === 1 ? ';text-align:center' : ''}`,
      sheetSeg1: 'flex:1;height:5px;border-radius:3px;background:#1f9d55',
      sheetSeg2: `flex:1;height:5px;border-radius:3px;background:${stage >= 2 ? '#1f9d55' : 'rgba(4,20,47,.12)'}`,
      stage1Style: p(1),
      stage2Style: p(2),
    };
  }
}
</script>
</body>
</html>
