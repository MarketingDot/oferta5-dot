<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter Italic';src:url('./assets/Inter-Italic.ttf') format('truetype-variations');font-weight:100 900;font-style:italic}
body{margin:0;background:#000;font-family:'Space Grotesk',ui-rounded,'Avenir Next',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

.flavor-card{position:relative;overflow:hidden;border:1.5px solid #dce4ed;border-radius:13px;background:#fff;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.flavor-card.selected{border:2px solid #0b203e;box-shadow:0 3px 0 rgba(11,32,62,.12)}
.flavor-photo{height:130px;margin:6px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.flavor-photo img{width:100%;height:100%;object-fit:cover}
.fl-mint{background:#a9e3f8}.fl-berry{background:#ffadc6}.fl-lime{background:#78d65b}.fl-citrus{background:#ffca66}
.flavor-name{display:block;padding:2px 10px 11px;font-size:13px;font-weight:700;line-height:1.1;text-align:center;color:#0b203e}
.flavor-badge{position:absolute;top:9px;right:9px;display:none;padding:4px 7px;border-radius:99px;background:#0b203e;color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em}
.flavor-card.selected .flavor-badge{display:block}

.freebie-card{border:1.5px solid #dce4ed;border-radius:13px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:8px}
.freebie-photo{width:100%;height:108px;border-radius:8px;background:#f1f5f9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.freebie-photo img{width:100%;height:100%;object-fit:contain}
.freebie-label{font-size:11.5px;font-weight:700;color:#0b203e;text-align:center;padding:8px 4px 4px;line-height:1.2}
</style>
</helmet>

<div style="width:100%;max-width:480px;margin:0 auto;position:relative;height:100vh;overflow:hidden;background:#000">

  <!-- Hero -->
  <div onClick="{{ openSheet }}" style="position:relative;width:100%;height:100%;cursor:pointer">
    <img src="./assets/banner-hero.png" alt="Promoção DOT" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none">
  </div>

  <!-- Lightbox -->
  <div id="img-lightbox" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(4,20,47,.88);align-items:center;justify-content:center;padding:24px;cursor:zoom-out">
    <img id="img-lightbox-img" src="" alt="" style="max-width:100%;max-height:88vh;border-radius:14px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)">
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:fixed;inset:0;background:rgba(4,20,47,.5)"></div>
    <div style="position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:88vh;background:#fff;border-top:2px solid #0b203e;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 0 rgba(11,32,62,.1);overflow:hidden">

      <!-- Handle -->
      <div onClick="{{ closeSheet }}" style="width:40px;height:4px;background:rgba(11,32,62,.22);border-radius:2px;margin:10px auto 0;cursor:pointer;flex-shrink:0"></div>

      <!-- Sliding panels -->
      <div style="display:grid;flex:1;overflow:hidden">

        <!-- Stage 1: 1º sabor -->
        <div style="{{ stage1PanelStyle }}">
          <div style="padding:12px 16px 0;flex-shrink:0">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="width:26px"></div>
              <span style="color:#627086;font-size:12px;font-weight:800;letter-spacing:.04em">PASSO 1 DE 2</span>
            </div>
            <div style="height:6px;overflow:hidden;margin:14px 0 16px;border-radius:20px;background:#e3e8ee"><span style="display:block;width:50%;height:100%;border-radius:inherit;background:#0b203e"></span></div>
            <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.12;letter-spacing:-.03em;color:#0b203e">Escolha seu 1º sabor</h2>
            <p style="margin:7px 0 0;min-height:20px">&nbsp;</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0;flex:1;overflow-y:auto">
            <sc-for list="{{ flavorList1 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓ Selecionado</span>
              </div>
            </sc-for>
          </div>
          <div style="height:20px;flex-shrink:0"></div>
        </div>

        <!-- Stage 2: 2º sabor -->
        <div style="{{ stage2PanelStyle }}">
          <div style="padding:12px 16px 0;flex-shrink:0">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <button onClick="{{ backToStage1 }}" style="border:0;padding:0;background:none;color:rgba(11,32,62,.4);font-size:26px;line-height:1;cursor:pointer">←</button>
              <span style="color:#627086;font-size:12px;font-weight:800;letter-spacing:.04em">PASSO 2 DE 2</span>
            </div>
            <div style="height:6px;overflow:hidden;margin:14px 0 16px;border-radius:20px;background:#e3e8ee"><span style="display:block;width:100%;height:100%;border-radius:inherit;background:#0b203e"></span></div>
            <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.12;letter-spacing:-.03em;color:#0b203e">Escolha seu 2º sabor</h2>
            <p style="margin:7px 0 0;color:#627086;font-size:14px">1º sabor escolhido: <strong style="color:#0b203e">{{ pick1Label }}</strong></p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0;flex:1;overflow-y:auto">
            <sc-for list="{{ flavorList2 }}" as="fl" hint-placeholder-count="4">
              <div onClick="{{ fl.onClick }}" class="{{ fl.cardClass }}">
                <div class="{{ fl.photoClass }}"><img src="{{ fl.img }}" alt="{{ fl.name }}"></div>
                <span class="flavor-name">{{ fl.name }}</span>
                <span class="flavor-badge">✓ Selecionado</span>
              </div>
            </sc-for>
          </div>
          <div style="padding:14px 16px 20px;border-top:1px solid #edf1f5;background:#fcfdff;flex-shrink:0">
            <sc-if value="{{ hasTempPick2 }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#627086;font-size:13px">
                <span style="display:grid;width:20px;height:20px;place-items:center;border-radius:50%;background:#dceecf;color:#396d24;font-size:11px;flex-shrink:0">✓</span>
                <span>Seu combo: <b style="color:#0b203e">{{ comboLabel }}</b></span>
              </div>
            </sc-if>
            <button onClick="{{ confirmPick2 }}" style="width:100%;min-height:52px;border:0;border-radius:10px;background:#0b203e;color:#fff;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer;font-family:inherit">CONFIRMAR SABORES →</button>
          </div>
        </div>

        <!-- Stage 3: Brindes -->
        <div style="{{ stage3PanelStyle }}">
          <div style="padding:12px 16px 0;flex-shrink:0">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <button onClick="{{ backToStage2 }}" style="border:0;padding:0;background:none;color:rgba(11,32,62,.4);font-size:26px;line-height:1;cursor:pointer">←</button>
              <span style="width:26px"></span>
            </div>
            <h2 style="margin:14px 0 0;font-size:24px;font-weight:700;line-height:1.12;letter-spacing:-.03em;color:#0b203e">Você ganhou os brindes!</h2>
            <p style="margin:7px 0 0;color:#627086;font-size:14px">Combo: <strong style="color:#0b203e">{{ comboLabel }}</strong></p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0;flex:1;overflow-y:auto">
            <sc-for list="{{ freebieList }}" as="fb" hint-placeholder-count="4">
              <div class="freebie-card">
                <div class="freebie-photo"><img src="{{ fb.img }}" alt="{{ fb.label }}" style="{{ fb.imgStyle }}"></div>
                <span class="freebie-label">{{ fb.label }}</span>
              </div>
            </sc-for>
          </div>
          <div style="padding:14px 16px 20px;border-top:1px solid #edf1f5;background:#fcfdff;flex-shrink:0">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#627086;font-size:13px">
              <span style="display:grid;width:20px;height:20px;place-items:center;border-radius:50%;background:#dceecf;color:#396d24;font-size:11px;flex-shrink:0">✓</span>
              <span>Seu combo: <b style="color:#0b203e">{{ comboLabel }}</b></span>
            </div>
            <button onClick="{{ resgatar }}" style="width:100%;min-height:52px;border:0;border-radius:10px;background:#0b203e;color:#fff;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer;font-family:inherit">RESGATAR AGORA →</button>
          </div>
        </div>

      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FLAVORS = [
  { name: 'Menta',              img: './assets/sabor-menta.jpg',            color: 'fl-mint'   },
  { name: 'Frutas Vermelhas',   img: './assets/sabor-frutas-vermelhas.jpg', color: 'fl-berry'  },
  { name: 'Melancia com Limão', img: './assets/sabor-melancia-novo.png',    color: 'fl-lime'   },
  { name: 'Citrus',             img: './assets/sabor-citrus.jpg',           color: 'fl-citrus' },
];

class Component extends DCLogic {
  state = {
    sheetOpen: false,
    pick1: null,
    pick2: null,
    tempPick2: null,
  };

  openSheet = () => {
    this._bodyScrollY = window.scrollY;
    document.body.style.cssText = `position:fixed;top:-${this._bodyScrollY}px;width:100%;overflow:hidden`;
    this.setState({ sheetOpen: true });
  };
  closeSheet = () => {
    document.body.style.cssText = '';
    window.scrollTo(0, this._bodyScrollY || 0);
    this.setState({ sheetOpen: false });
  };
  backToStage1 = () => this.setState({ pick1: null, pick2: null, tempPick2: null });
  backToStage2  = () => this.setState({ pick2: null });
  confirmPick2  = () => {
    const { tempPick2 } = this.state;
    if (tempPick2) this.setState({ pick2: tempPick2 });
  };
  resgatar = () => {
    document.body.style.cssText = '';
    try { window.top.location.href = 'https://minhadot.com'; } catch(e) { window.location.href = 'https://minhadot.com'; }
  };

  renderVals() {
    const { sheetOpen, pick1, pick2, tempPick2 } = this.state;
    const stage = pick1 == null ? 1 : pick2 == null ? 2 : 3;
    const p = (n) => `grid-area:1/1;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;transform:translateX(${(n - stage) * 100}%);transition:transform .38s cubic-bezier(.25,.46,.45,.94)${stage !== n ? ';pointer-events:none' : ''}`;

    const flavorList1 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${pick1 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ pick1: f.name }),
    }));

    const flavorList2 = FLAVORS.map(f => ({
      name: f.name, img: f.img,
      cardClass: `flavor-card${tempPick2 === f.name ? ' selected' : ''}`,
      photoClass: `flavor-photo ${f.color}`,
      onClick: () => this.setState({ tempPick2: f.name }),
    }));

    const FREEBIE_DEFS = [
      { label: 'Pouch Melancia c/ Limão', img: './assets/pouch-melancia.png', imgStyle: 'width:100%;height:100%;object-fit:contain' },
      { label: 'Mousepad DOT',            img: './assets/mousepad-dot.png',   imgStyle: 'width:100%;height:100%;object-fit:contain' },
      { label: 'Apoio de Teclado',        img: './assets/apoio-teclado.png',  imgStyle: 'width:100%;height:100%;object-fit:contain' },
      { label: 'Frete Grátis',            img: './assets/frete-gratis.png',   imgStyle: 'width:150%;height:150%;object-fit:contain;transform:rotate(345deg)' },
    ];
    const freebieList = FREEBIE_DEFS.map(d => ({ label: d.label, img: d.img, imgStyle: d.imgStyle }));

    const pick2eff = pick2 || tempPick2 || null;
    const comboLabel = pick1 && pick2eff ? `${pick1} + ${pick2eff}` : (pick1 || '');

    return {
      sheetOpen,
      openSheet: this.openSheet,
      closeSheet: this.closeSheet,
      backToStage1: this.backToStage1,
      backToStage2: this.backToStage2,
      confirmPick2: this.confirmPick2,
      resgatar: this.resgatar,
      pick1Label: pick1 || '',
      comboLabel,
      hasTempPick2: !!tempPick2,
      stage1PanelStyle: p(1),
      stage2PanelStyle: p(2),
      stage3PanelStyle: p(3),
      flavorList1,
      flavorList2,
      freebieList,
    };
  }
}
</script>
</body>
</html>
